</style></head><body><main class="page"><section class="hero"><div><div class="ey">咖啡感官實驗室</div><h1>咖啡風味輪</h1><p>三道光同步探索風味，最後以三味交集推薦咖啡。</p></div><div class="heroMeta"><span>固定輪盤</span><span>三光掃描</span><span>三味全中</span></div></section><section class="layout"><article class="panel left"><div class="head"><div><h2>風味輪</h2><div class="sub">即時掃描 · 三味交集</div></div><div class="status" id="status">準備</div></div><div class="stage" id="stage"><div class="wheelFrame"><div class="halo"></div><div class="wrap"><canvas id="wheel" width="1000" height="1000"></canvas><button class="center" id="restart"><b>重選</b><span>掃描</span></button></div></div></div><div class="telemetry"><div class="caption"><i class="dot" id="dot"></i><div class="ct"><b id="ctitle">準備中</b><span id="csub">即將自動開始掃描</span></div><span class="auto">自動</span></div><div class="lights"><div class="light" id="l0"><b style="color:var(--c)">01 · 順時針</b><span>等待</span></div><div class="light" id="l1"><b style="color:var(--p)">02 · 逆時針</b><span>等待</span></div><div class="light" id="l2"><b style="color:var(--y)">03 · 隨機</b><span>等待</span></div></div></div><div class="controls"><div class="chips" id="chips"><div class="chip">尚未鎖定風味</div></div><button class="btn" id="again">重新抽取</button></div></article><aside class="panel right"><div class="intro"><div class="introTop"><h2>本輪推薦</h2><small>三味全中</small></div><p id="summary">只顯示同時符合三個最終風味的咖啡。</p><div class="strict">三味完全匹配 · 3 / 3</div></div><div id="results"><div class="empty">即將自動開始掃描。</div><div class="route"><b style="color:#7fb8c2">順時針</b> · <b style="color:#b9839f">逆時針</b> · <b style="color:#c7ab72">隨機跳格</b></div></div></aside></section></main><script>
const L=['#7FB8C2','#B9839F','#C7AB72'];
const GROUP_LABEL={FLORAL:'花',FRUIT:'果',SOUR:'酸',GREEN:'青',OTHER:'雜',ROAST:'焙',SPICE:'香','NUT / COCOA':'可',SWEET:'甜'};

const G=[['FLORAL','#94697d',['JASMINE','ROSE','BLACK TEA']],['FRUIT','#9e655e',['BLACKBERRY','BLUEBERRY','STRAWBERRY','RASPBERRY','RAISIN','CHERRY','PINEAPPLE','APPLE','PEACH','ORANGE','LEMON','LIME']],['SOUR','#9c8a5b',['CITRIC ACID','MALIC ACID','WINEY','FERMENTED']],['GREEN','#657767',['HERB']],['OTHER','#667b80',['WOODY']],['ROAST','#77665a',['SMOKY']],['SPICE','#78636a',['CLOVE']],['NUT / COCOA','#6e665f',['HAZELNUT','DARK CHOCOLATE']],['SWEET','#8d7467',['HONEY','MAPLE']]];

const cv=document.getElementById('wheel'),x=cv.getContext('2d'),stage=document.getElementById('stage'),restart=document.getElementById('restart'),again=document.getElementById('again'),status=document.getElementById('status'),chips=document.getElementById('chips'),results=document.getElementById('results'),summary=document.getElementById('summary'),dot=document.getElementById('dot'),ctitle=document.getElementById('ctitle'),csub=document.getElementById('csub'),LE=[0,1,2].map(i=>document.getElementById('l'+i));
const leaf=[];let locked=[null,null,null],scans=[null,null,null],busy=false,cur=-Math.PI/2,n=G.reduce((a,g)=>a+g[2].length,0);G.forEach(g=>{let span=g[2].length/n*Math.PI*2,step=span/g[2].length;g[2].forEach((name,j)=>leaf.push({name,group:g[0],color:g[1],a0:cur+j*step,a1:cur+(j+1)*step}));cur+=span});function sec(a,b,s,e){x.beginPath();x.arc(0,0,b,s,e);x.arc(0,0,a,e,s,true);x.closePath()}function cap(c,t,s){dot.style.background=c;dot.style.boxShadow=`0 0 16px ${c}`;ctitle.textContent=t;csub.textContent=s}
function draw(){x.clearRect(0,0,1000,1000);x.save();x.translate(500,500);const compact=innerWidth<640,ri=66,rm=198,ro=390;[ri,rm,ro].forEach((r,k)=>{x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.strokeStyle=k===2?'#d9ccb540':'#d9ccb520';x.lineWidth=k===2?2:1;x.stroke()});G.forEach(g=>{let a=leaf.filter(v=>v.group===g[0]),s=a[0].a0,e=a.at(-1).a1,m=(s+e)/2;sec(ri,rm,s,e);let grad=x.createRadialGradient(0,0,ri,0,0,rm);grad.addColorStop(0,g[1]+'d0');grad.addColorStop(1,g[1]);x.fillStyle=grad;x.fill();x.strokeStyle='#ffffff28';x.stroke();x.save();x.translate(Math.cos(m)*133,Math.sin(m)*133);let r=m+Math.PI/2;if(Math.cos(m)<0)r+=Math.PI;x.rotate(r);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#f8f4ed';x.font='800 18px system-ui';x.fillText(GROUP_LABEL[g[0]]||g[0],0,0,46);x.restore()});leaf.forEach((v,i)=>{sec(rm,ro,v.a0,v.a1);let m=(v.a0+v.a1)/2,grad=x.createRadialGradient(0,0,rm,0,0,ro);grad.addColorStop(0,v.color+'d3');grad.addColorStop(1,v.color+'f1');x.fillStyle=grad;x.globalAlpha=.95;x.fill();x.globalAlpha=1;x.strokeStyle='#ffffff2c';x.lineWidth=.85;x.stroke();if(!compact||i%2===0){x.save();x.translate(Math.cos(m)*302,Math.sin(m)*302);let r=m;if(Math.cos(m)<0)r+=Math.PI;x.rotate(r);x.textAlign='center';x.textBaseline='middle';x.fillStyle='#faf7f1';let label=FLAVOR_ZH[v.name]||v.name;x.font=`700 ${label.length>5?8.6:10.2}px system-ui`;x.fillText(label,0,0,82);x.restore()}});scans.forEach(s=>{if(!s)return;(s.history||[s.pos]).slice(-6).reverse().forEach((idx,t)=>{let v=leaf[(idx+leaf.length)%leaf.length];sec(rm-5,ro+8,v.a0,v.a1);x.fillStyle=s.color;x.globalAlpha=[.62,.42,.27,.16,.08,.04][t]||.04;x.shadowBlur=t===0?34:14;x.shadowColor=s.color;x.fill();x.globalAlpha=1;x.strokeStyle=s.color;x.lineWidth=t===0?3.2:1;x.stroke();x.shadowBlur=0})});locked.forEach((name,i)=>{if(!name)return;let v=leaf.find(q=>q.name===name),c=L[i],m=(v.a0+v.a1)/2;sec(ri-4,ro+9,v.a0,v.a1);x.fillStyle=c+'4d';x.shadowBlur=42;x.shadowColor=c;x.fill();x.strokeStyle=c;x.lineWidth=3;x.stroke();x.shadowBlur=0;x.save();x.translate(Math.cos(m)*430,Math.sin(m)*430);let r=m;if(Math.cos(m)<0)r+=Math.PI;x.rotate(r);x.textAlign='center';x.fillStyle=c;x.font='800 12px system-ui';x.fillText(FLAVOR_ZH[name]||name,0,0,88);x.restore()});let cg=x.createRadialGradient(-15,-18,7,0,0,ri);cg.addColorStop(0,'#e5ddd1');cg.addColorStop(.38,'#ad946f');cg.addColorStop(1,'#3a342e');x.beginPath();x.arc(0,0,ri,0,Math.PI*2);x.fillStyle=cg;x.fill();x.strokeStyle='#c9b79270';x.stroke();x.restore()}
function pick(){let d=DB[Math.floor(Math.random()*DB.length)],a=d[4].filter(f=>leaf.some(v=>v.name===f));for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3)}function exact(s){return DB.filter(d=>s.every(f=>d[4].includes(f)))}function ls(i,state,txt){LE[i].querySelector('span').textContent=txt;LE[i].style.borderColor=state==='wait'?'':L[i]+'66';LE[i].style.boxShadow=state==='run'?`0 0 16px ${L[i]}1c`:`inset 0 0 14px ${L[i]}0e`}
function directional(target,c,o,dir,done){const N=leaf.length,ti=leaf.findIndex(v=>v.name===target);let pos=(ti+Math.floor(N*(o?.38:.47))+o*5)%N,dist=dir>0?(ti-pos+N)%N:(pos-ti+N)%N,total=N*(3+o)+dist,step=0;scans[o]={pos,color:c,history:[pos]};ls(o,'run',dir>0?'順時針掃描':'逆時針掃描');const tick=()=>{step++;pos=(pos+dir+N)%N;scans[o].history.push(pos);draw();if(step>=total){scans[o]=null;locked[o]=target;ls(o,'lock',FLAVOR_ZH[target]||target);draw();done();return}let p=step/total;setTimeout(tick,p<.68?44:44+Math.pow((p-.68)/.32,2)*210)};tick()}
function randomJump(target,c,o,done){const N=leaf.length,ti=leaf.findIndex(v=>v.name===target),total=44+Math.floor(Math.random()*8);let step=0,pos=Math.floor(Math.random()*N);scans[o]={pos,color:c,history:[pos]};ls(o,'run','隨機跳格');const tick=()=>{step++;if(step>=total)pos=ti;else{let next=pos;while(next===pos)next=Math.floor(Math.random()*N);pos=next}scans[o].history.push(pos);draw();if(step>=total){scans[o]=null;locked[o]=target;ls(o,'lock',FLAVOR_ZH[target]||target);draw();done();return}let p=step/total;setTimeout(tick,p<.65?92:92+Math.pow((p-.65)/.35,2)*250)};tick()}
function render(s){chips.innerHTML=s.map((f,i)=>`<div class="chip" style="border-color:${L[i]}55"><i style="background:${L[i]};box-shadow:0 0 12px ${L[i]}"></i><span style="color:${L[i]}">${FLAVOR_ZH[f]||f}</span></div>`).join('');let m=exact(s);summary.textContent=`鎖定：${s.map(f=>FLAVOR_ZH[f]||f).join('・')}`;results.innerHTML=m.slice(0,3).map((d,i)=>`<section class="card"><div class="rank">#${i+1}</div><span class="badge">3 / 3</span><h3>${d[0]}</h3><div class="meta"><b>產區</b>・${d[1]}<br><b>處理</b>・${d[2]}　<b>焙度</b>・${d[3]}<br>${d[5]}</div><div class="triple">${s.map((f,j)=>`<span style="border:1px solid ${L[j]}55;color:${L[j]};background:${L[j]}10">${FLAVOR_ZH[f]||f}</span>`).join('')}</div><div class="brew"><b>沖煮</b>・${d[6]}</div></section>`).join('')}
function run(){if(busy)return;busy=true;locked=[null,null,null];scans=[null,null,null];draw();restart.disabled=again.disabled=true;stage.classList.add('active');LE.forEach((_,i)=>ls(i,'wait','等待'));results.innerHTML='<div class="empty">掃描中…</div>';let s=pick(),done=0,fin=()=>{done++;status.textContent=`已鎖定 ${done}/3`;if(done===3){stage.classList.remove('active');status.textContent='完成';cap('#f4efe7','推薦完成',s.map(f=>FLAVOR_ZH[f]||f).join('・'));render(s);restart.disabled=again.disabled=false;busy=false}};status.textContent='掃描中';cap('#f4efe7','即時掃描','順時針・逆時針・隨機');directional(s[0],L[0],0,1,fin);directional(s[1],L[1],1,-1,fin);randomJump(s[2],L[2],2,fin)}
draw();restart.onclick=again.onclick=run;addEventListener('resize',draw);addEventListener('load',()=>setTimeout(run,650));
</script></body></html>
