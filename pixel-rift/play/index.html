<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#100b2c"><title>PIXEL RIFT V6.3：模式選擇</title><style>:root{--bg:#09061d;--gold:#ffd166;--cyan:#5ce1e6;--muted:#aaa1c9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"Courier New",monospace;color:#fff}body{display:grid;place-items:center}.launcher{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(92,225,230,.12),transparent 28%),radial-gradient(circle at 80% 70%,rgba(181,134,255,.13),transparent 30%),#09061d}.panel{width:min(820px,94vw);border:2px solid #4d3c90;background:linear-gradient(180deg,#17103f,#0f0b2d);padding:28px;box-shadow:0 0 0 5px #09061d,0 24px 80px rgba(0,0,0,.55)}h1{margin:0;text-align:center;color:var(--gold);font-size:clamp(34px,7vw,64px);letter-spacing:.08em;text-shadow:3px 3px 0 #5c335f}h1 span{display:block;color:#fff;font-size:.28em;letter-spacing:.2em;margin-top:8px}p{text-align:center;color:var(--muted);line-height:1.6}.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.mode{border:2px solid #4d3c90;background:#120d31;padding:20px;cursor:pointer;color:#fff;text-align:left;box-shadow:0 5px 0 #08051a}.mode:hover{filter:brightness(1.13);transform:translateY(-1px)}.mode strong{display:block;font-size:23px;margin-bottom:8px}.mode small{display:block;color:var(--muted);font:700 13px/1.55 "Courier New",monospace}.single strong{color:var(--cyan)}.coop{border-color:#8a6bcf}.coop strong{color:var(--gold)}.badge{display:inline-block;margin-top:12px;border:1px solid #5b4b91;padding:5px 8px;color:#d8d0ff;font:700 11px "Courier New",monospace}.features{margin-top:15px;padding:10px;border:1px solid #44367f;background:#0d0927;text-align:center;color:#c9c1e5;font-size:11px;line-height:1.7}#gameFrame{position:fixed;inset:0;display:none;width:100%;height:100%;border:0;background:#09061d;z-index:5}#loading{position:fixed;inset:0;z-index:6;display:none;place-items:center;background:#09061d;color:var(--gold);font:900 18px "Courier New",monospace;letter-spacing:.08em}@media(max-width:650px){.modes{grid-template-columns:1fr}.panel{padding:18px}}</style></head><body><section class="launcher" id="launcher"><div class="panel"><h1>PIXEL RIFT V6.3<span>深淵侵襲</span></h1><p>高波次正式進入深淵生態：新增 10 種高階敵人，保留 APEX，Wave 45 迎戰深淵領主，Wave 90 挑戰災厄帝王</p><div class="modes"><button class="mode single" data-src="../v6/index.html?players=1&amp;v=6.3"><strong>1P 單人模式</strong><small>高階敵人 × 套裝 Build × 轉職奧義<br>APEX × 深淵領主 × 災厄帝王</small><span class="badge">V6.3 SOLO ABYSS</span></button><button class="mode coop" data-src="../v6/index.html?players=2&amp;v=6.3"><strong>2P 本機雙人</strong><small>P1：WASD＋SPACE＋Q<br>P2：方向鍵＋ENTER＋右 SHIFT<br>雙人共同挑戰終局 Boss</small><span class="badge">V6.3 LOCAL CO-OP</span></button></div><div class="features">10 種新高階敵人　｜　Wave 30 APEX　｜　Wave 45 深淵領主　｜　Wave 90 災厄帝王　｜　三階段終局戰</div></div></section><div id="loading">OPENING PIXEL RIFT V6.3...</div><iframe id="gameFrame" title="PIXEL RIFT V6.3" allow="autoplay; fullscreen; gamepad"></iframe><script>const frame=document.getElementById('gameFrame'),loading=document.getElementById('loading'),launcher=document.getElementById('launcher');document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{launcher.style.display='none';loading.style.display='grid';frame.style.display='block';frame.src=btn.dataset.src}));frame.addEventListener('load',()=>{loading.style.display='none'});</script></body></html>
